[project]
name = "retail-agent"
version = "0.1.0"
description = "Agente de atención para productos electrónicos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "email-validator>=2.1.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2.0",
    "streamlit>=1.35.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
retail-agent = "run:main"
db-init = "app.db.init_db:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]